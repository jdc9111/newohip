// ── fuzzy score: higher = better match ───────────────────────────────────────
function score(haystack, needle) {
  if (!needle) return 1;
  const h = haystack.toLowerCase();
  const n = needle.toLowerCase();

  // exact substring → highest score
  if (h.includes(n)) return 100 + (n.length / h.length) * 50;

  // word-by-word partial match
  const words = n.split(/\s+/).filter(Boolean);
  let hits = 0;
  for (const w of words) {
    if (h.includes(w)) hits++;
  }
  if (hits === words.length) return 60 + hits * 5;
  if (hits > 0) return 30 + hits * 10;

  return 0;
}

// ── highlight matching substrings ────────────────────────────────────────────
function highlight(text, query) {
  if (!query) return esc(text);
  const q = query.trim();
  if (!q) return esc(text);
  // try to highlight the longest matching substring
  const idx = text.toLowerCase().indexOf(q.toLowerCase());
  if (idx !== -1) {
    return esc(text.slice(0, idx))
      + "<mark>" + esc(text.slice(idx, idx + q.length)) + "</mark>"
      + esc(text.slice(idx + q.length));
  }
  // highlight individual words
  let result = esc(text);
  q.split(/\s+/).filter(Boolean).forEach(w => {
    const re = new RegExp(escRe(w), "gi");
    result = result.replace(re, m => "<mark>" + m + "</mark>");
  });
  return result;
}

function esc(s) {
  return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}
function escRe(s) {
  return s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
}

function render(query) {
  const q = (query || "").trim();

  tbody.innerHTML = "";

  cards.innerHTML = "";

  if (!q) {
    tbl.style.display = "none";
    empty.style.display = "none";
    status.textContent = "";
    return;
  }

  const results = DATA
    .map((r, i) => ({ r, s: score(SEARCH_TOKENS[i], q) }))
    .filter(x => x.s > 0)
    .sort((a, b) => b.s - a.s);

  if (results.length === 0) {
    tbl.style.display = "none";
    empty.style.display = "block";
    status.textContent = "";
    return;
  }

  tbl.style.display = "";
  empty.style.display = "none";
  status.textContent = `${results.length} result${results.length === 1 ? "" : "s"} for "${q}"`;


  const frag = document.createDocumentFragment();
  for (const { r } of results) {
    const [code, desc, fee, cat, notes] = r;
    const feeStr = fee !== null ? "$" + fee : "—";
    const extNote = EXTENDED_NOTES[code] || "";

    // Desktop table row
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${highlight(code, q)}</td>
      <td>
        ${highlight(desc, q)}${extNote ? `<button class="info-btn" onclick="toggleExtNote(this)" title="Show details">i</button><div class="ext-note">${extNote}</div>` : ""}
        <div class="cat-pill">${highlight(cat, q)}</div>
        ${notes ? `<div class="note">${/[<>]/.test(notes) ? notes : highlight(notes, q)}</div>` : ""}
      </td>
      <td>${feeStr}</td>`;
    frag.appendChild(tr);

    // Mobile card
    const card = document.createElement("div");
    card.className = "result-card";
    const hasDetails = !!(cat || notes || extNote);
    card.innerHTML = `
      <div class="card-top">
        <span class="card-code">${highlight(code, q)}</span>
        <span class="card-fee">${feeStr}</span>
      </div>
      <div class="card-desc">${highlight(desc, q)}</div>
      ${hasDetails ? `
      <button class="card-details-btn" onclick="toggleCardNote(this)">Details ›</button>
      <div class="card-details-panel">
        ${cat ? `<span class="card-cat">${highlight(cat, q)}</span>` : ""}
        ${notes ? `<div class="card-note">${/[<>]/.test(notes) ? notes : highlight(notes, q)}</div>` : ""}
        ${extNote ? `<div class="card-ext-note">${extNote}</div>` : ""}
      </div>` : ""}`;
    cards.appendChild(card);
  }
  tbody.appendChild(frag);
  // showCOTDBanner(); // disabled
}

let cotdBannerReady = false;

function showCOTDBanner() {
  if (cotdBannerReady) return;
  if (localStorage.getItem('cotd_optout')) return;
  if (sessionStorage.getItem('cotd_shown')) return;

  const code = FLAGGED_CODES[Math.floor(Math.random() * FLAGGED_CODES.length)];
  const row  = DATA.find(r => r[0] === code);
  if (!row) return;

  cotdBannerReady = true;
  sessionStorage.setItem('cotd_shown', '1');

  const [c, desc, fee] = row;
  const feeStr = fee !== null ? '$' + fee.toFixed(2) : '—';

  const banner = document.getElementById('cotd-banner');
  banner.innerHTML = `
    <button class="cotd-b-close" onclick="dismissCOTD(false)" aria-label="Dismiss">✕</button>
    <div class="cotd-b-label">💡 Code of the Day</div>
    <div class="cotd-b-body">
      <div class="cotd-b-row">
        <span class="cotd-b-code">${esc(c)}</span>
        <span class="cotd-b-fee">${feeStr}</span>
      </div>
      <div class="cotd-b-desc">${esc(desc)}</div>
      <div class="cotd-b-actions">
        <button class="cotd-b-search" onclick="dismissCOTD(false);document.getElementById('query').value='${esc(c)}';document.getElementById('query').dispatchEvent(new Event('input'))">Search this code →</button>
        <button class="cotd-b-optout" onclick="dismissCOTD(true)">Don't show again</button>
      </div>
    </div>`;
  banner.classList.add('visible');
}

function dismissCOTD(optOut) {
  if (optOut) localStorage.setItem('cotd_optout', '1');
  const banner = document.getElementById('cotd-banner');
  banner.classList.remove('visible');
}
