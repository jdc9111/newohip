<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    background: #f0f4f8;
    color: #1a202c;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* header/nav styles → header.js */

  /* ── Time-based reminder banner ── */
  .reminder-banner {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 12px 24px;
    background: #fffbeb;
    border-bottom: 2px solid #f59e0b;
    animation: slideDown 0.3s ease;
  }
  @keyframes slideDown {
    from { opacity: 0; transform: translateY(-8px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .reminder-icon { font-size: 1.25rem; flex-shrink: 0; margin-top: 1px; }
  .reminder-body { flex: 1; }
  .reminder-title { font-size: 0.88rem; font-weight: 700; color: #92400e; }
  .reminder-codes { margin-top: 4px; font-size: 0.82rem; color: #78350f; }
  .reminder-codes code {
    display: inline-block;
    background: #fef3c7;
    border: 1px solid #fcd34d;
    border-radius: 4px;
    padding: 1px 6px;
    font-family: inherit;
    font-weight: 700;
    color: #92400e;
    margin: 2px 3px 2px 0;
    cursor: pointer;
  }
  .reminder-codes code:hover { background: #fde68a; }
  .reminder-dismiss {
    background: none; border: none; cursor: pointer;
    color: #b45309; font-size: 1.1rem; line-height: 1;
    padding: 2px 4px; border-radius: 4px; flex-shrink: 0;
    opacity: 0.7;
  }
  .reminder-dismiss:hover { opacity: 1; background: #fef3c7; }

  .search-bar {
    background: white;
    padding: 16px 24px;
    border-bottom: 1px solid #dde3ed;
    position: sticky;
    top: 0;
    z-index: 10;
    box-shadow: 0 2px 6px rgba(0,0,0,0.07);
  }

  .search-wrap {
    max-width: 720px;
    margin: 0 auto;
    position: relative;
  }

  .search-wrap svg {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    color: #718096;
    pointer-events: none;
  }

  #query {
    width: 100%;
    padding: 11px 14px 11px 42px;
    font-size: 1rem;
    border: 2px solid #BDD7EE;
    border-radius: 8px;
    outline: none;
    transition: border-color 0.15s;
    background: #fafcff;
  }
  #query:focus { border-color: #1F4E79; background: white; }

  .hint {
    max-width: 720px;
    margin: 6px auto 0;
    font-size: 0.75rem;
    color: #718096;
  }

  main {
    flex: 1;
    max-width: 960px;
    margin: 24px auto;
    padding: 0 16px 60px;
  }

  #status {
    font-size: 0.82rem;
    color: #4a5568;
    margin-bottom: 12px;
    min-height: 1.2em;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    background: white;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 1px 4px rgba(0,0,0,0.08);
  }

  thead th {
    background: #1F4E79;
    color: white;
    font-size: 0.78rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    padding: 11px 14px;
    text-align: left;
  }
  thead th:nth-child(1) { width: 90px; text-align: center; }
  thead th:nth-child(3) { width: 85px; text-align: right; }

  tbody tr { border-bottom: 1px solid #edf2f7; transition: background 0.1s; }
  tbody tr:last-child { border-bottom: none; }
  tbody tr:hover { background: #ebf3fb; }

  td { padding: 10px 14px; font-size: 0.88rem; vertical-align: top; }
  td:nth-child(1) { text-align: center; font-weight: 700; font-size: 0.92rem; color: #1F4E79; letter-spacing: 0.03em; }
  td:nth-child(3) { text-align: right; font-weight: 600; color: #276749; white-space: nowrap; }

  .cat-pill {
    display: inline-block;
    font-size: 0.68rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: #1F4E79;
    background: #BDD7EE;
    border-radius: 4px;
    padding: 2px 6px;
    margin-top: 3px;
  }

  .note { font-size: 0.76rem; color: #718096; margin-top: 3px; }

  .info-btn {
    display: inline-flex; align-items: center; justify-content: center;
    width: 16px; height: 16px; border-radius: 50%;
    background: #e2e8f0; color: #4a5568;
    font-size: 0.65rem; font-weight: 800; line-height: 1;
    border: none; cursor: pointer; margin-left: 6px;
    vertical-align: middle; flex-shrink: 0;
    transition: background 0.15s;
  }
  .info-btn:hover, .info-btn.open { background: #1F4E79; color: white; }
  .ext-note {
    display: none; margin-top: 8px; padding: 10px 12px;
    background: #f0f7ff; border-left: 3px solid #1F4E79; border-radius: 0 6px 6px 0;
    font-size: 0.78rem; color: #2d3748; line-height: 1.6;
  }
  .ext-note.open { display: block; }
  .ext-note ul { margin: 4px 0 0 14px; }
  .ext-note li { margin-bottom: 2px; }

  mark {
    background: #fef08a;
    border-radius: 2px;
    padding: 0 1px;
    color: inherit;
  }

  #empty {
    text-align: center;
    padding: 60px 20px;
    color: #a0aec0;
    display: none;
  }
  #empty svg { margin-bottom: 12px; opacity: 0.4; }
  #empty p { font-size: 0.95rem; }

  /* ── Code-of-the-Day modal ── */
  .cotd-overlay {
    position: fixed; inset: 0; z-index: 1000;
    background: rgba(15,23,42,0.55);
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
    animation: fadeIn 0.2s ease;
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .cotd-card {
    background: white;
    border-radius: 14px;
    max-width: 520px; width: 100%;
    box-shadow: 0 20px 60px rgba(0,0,0,0.25);
    overflow: hidden;
    animation: slideUp 0.25s ease;
  }
  @keyframes slideUp {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .cotd-header {
    background: #1F4E79;
    color: white;
    padding: 14px 20px;
    display: flex; align-items: center; gap: 10px;
  }
  .cotd-header-icon { font-size: 1.3rem; }
  .cotd-header-text { flex: 1; }
  .cotd-header-label {
    font-size: 0.7rem; font-weight: 700; letter-spacing: 0.08em;
    text-transform: uppercase; opacity: 0.75;
  }
  .cotd-header-title { font-size: 1rem; font-weight: 700; }
  .cotd-body { padding: 20px; }
  .cotd-code-row {
    display: flex; align-items: baseline; gap: 10px; margin-bottom: 10px;
  }
  .cotd-code {
    font-size: 1.5rem; font-weight: 800; color: #1F4E79; letter-spacing: 0.04em;
  }
  .cotd-fee {
    font-size: 1rem; font-weight: 700; color: #276749;
  }
  .cotd-desc {
    font-size: 1rem; font-weight: 600; color: #1a202c; margin-bottom: 8px;
  }
  .cotd-cat {
    display: inline-block; font-size: 0.68rem; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.05em;
    color: #1F4E79; background: #BDD7EE;
    border-radius: 4px; padding: 2px 8px; margin-bottom: 10px;
  }
  .cotd-note {
    font-size: 0.8rem; color: #4a5568;
    border-top: 1px solid #e2e8f0; padding-top: 10px; margin-top: 6px;
  }
  .cotd-ext {
    margin-top: 10px; padding: 10px 12px;
    background: #f0f7ff; border-left: 3px solid #1F4E79;
    border-radius: 0 6px 6px 0;
    font-size: 0.8rem; color: #2d3748; line-height: 1.6;
  }
  .cotd-ext ul { margin: 4px 0 0 14px; }
  .cotd-ext li { margin-bottom: 3px; }
  .cotd-footer {
    padding: 14px 20px;
    border-top: 1px solid #edf2f7;
    display: flex; justify-content: flex-end; gap: 10px;
  }
  .cotd-btn-optout {
    padding: 8px 18px; border-radius: 7px; font-size: 0.88rem; font-weight: 600;
    border: none; background: none; color: #a0aec0; cursor: pointer;
    margin-right: auto;
  }
  .cotd-btn-optout:hover { color: #718096; text-decoration: underline; }
  .cotd-btn-search {
    padding: 8px 18px; border-radius: 7px; font-size: 0.88rem; font-weight: 600;
    border: 2px solid #1F4E79; color: #1F4E79; background: white; cursor: pointer;
  }
  .cotd-btn-search:hover { background: #ebf3fb; }
  .cotd-btn-dismiss {
    padding: 8px 18px; border-radius: 7px; font-size: 0.88rem; font-weight: 600;
    border: none; background: #1F4E79; color: white; cursor: pointer;
  }
  .cotd-btn-dismiss:hover { background: #163d5e; }

 }

// ── fuzzy score: higher = better match ───────────────────────────────────────
function score(haystack, needle) {
  if (!needle) return 1;
  const h = haystack.toLowerCase();
  const n = needle.toLowerCase();

  // exact substring → highest score
  if (h.includes(n)) return 100 + (n.length / h.length) * 50;

  // word-by-word partial match
  const words = n.split(/\s+/).filter(Boolean);
  let hits = 0;
  for (const w of words) {
    if (h.includes(w)) hits++;
  }
  if (hits === words.length) return 60 + hits * 5;
  if (hits > 0) return 30 + hits * 10;

  return 0;
}

// ── highlight matching substrings ────────────────────────────────────────────
function highlight(text, query) {
  if (!query) return esc(text);
  const q = query.trim();
  if (!q) return esc(text);
  // try to highlight the longest matching substring
  const idx = text.toLowerCase().indexOf(q.toLowerCase());
  if (idx !== -1) {
    return esc(text.slice(0, idx))
      + "<mark>" + esc(text.slice(idx, idx + q.length)) + "</mark>"
      + esc(text.slice(idx + q.length));
  }
  // highlight individual words
  let result = esc(text);
  q.split(/\s+/).filter(Boolean).forEach(w => {
    const re = new RegExp(escRe(w), "gi");
    result = result.replace(re, m => "<mark>" + m + "</mark>");
  });
  return result;
}

function esc(s) {
  return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}
function escRe(s) {
  return s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
}

function toggleExtNote(btn) {
  const panel = btn.nextElementSibling;
  const open  = panel.classList.toggle('open');
  btn.classList.toggle('open', open);
  btn.title = open ? 'Hide details' : 'Show details';
}

function render(query) {
  const q = (query || "").trim();

  tbody.innerHTML = "";

  if (!q) {
    tbl.style.display = "none";
    empty.style.display = "none";
    status.textContent = "";
    return;
  }

  const results = DATA
    .map((r, i) => ({ r, s: score(SEARCH_TOKENS[i], q) }))
    .filter(x => x.s > 0)
    .sort((a, b) => b.s - a.s);

  if (results.length === 0) {
    tbl.style.display = "none";
    empty.style.display = "block";
    status.textContent = "";
    return;
  }

  tbl.style.display = "";
  empty.style.display = "none";
  status.textContent = `${results.length} result${results.length === 1 ? "" : "s"} for "${q}"`;


  const frag = document.createDocumentFragment();
  for (const { r } of results) {
    const [code, desc, fee, cat, notes] = r;
    const tr = document.createElement("tr");
    const feeStr = fee !== null ? "$" + fee : "—";

    const extNote = EXTENDED_NOTES[code] || "";
    tr.innerHTML = `
      <td>${highlight(code, q)}</td>
      <td>
        ${highlight(desc, q)}${extNote ? `<button class="info-btn" onclick="toggleExtNote(this)" title="Show details">i</button><div class="ext-note">${extNote}</div>` : ""}
        <div class="cat-pill">${highlight(cat, q)}</div>
        ${notes ? `<div class="note">${/[<>]/.test(notes) ? notes : highlight(notes, q)}</div>` : ""}
      </td>
      <td>${feeStr}</td>`;
    frag.appendChild(tr);
  }
  tbody.appendChild(frag);
}

// ── debounced input handler ───────────────────────────────────────────────────
let timer;
document.getElementById("query").addEventListener("input", e => {
  clearTimeout(timer);
  timer = setTimeout(() => render(e.target.value), 120);
});

// initial render
render("");

// ── Code-of-the-Day ──────────────────────────────────────────────────────────
// Add codes here that are worth remembering — rarely billed, high-value, or easily forgotten.
const FLAGGED_CODES = [
  "E420",   // Trauma ISS premium — frequently missed
  "H113",   // Weekend/holiday + Fri eve premium
  "H114",   // Weekday evening premium — new, often missed
  "H264",   // ED pelvic exam with speculum — new, underused
  "Z756",   // Rectal/fecal disimpaction — often forgotten
  "G552",   // IUD removal without sedation
  "Z363",   // Chest tube removal — separate billable code
  "K034",   // Telephone report of reportable disease to MOH
  "K035",   // Medical conditions report to MOT
  "Z756",   // Rectal/fecal disimpaction — often forgotten
  "Z104",   // Perianal abscess I&D — significant fee increase April 2026
  "K071",   // Acute Home Care Supervision — often missed for ED follow-ups
];

function openCOTD() {
  const code = FLAGGED_CODES[Math.floor(Math.random() * FLAGGED_CODES.length)];
  const row  = DATA.find(r => r[0] === code);
  if (!row) return;

  const [c, desc, fee, cat, notes] = row;
  const feeStr   = fee !== null ? '$' + fee.toFixed(2) : '—';
  const extNote  = EXTENDED_NOTES[c] || "";
  const noteHtml = notes
    ? `<div class="cotd-note">${/[<>]/.test(notes) ? notes : esc(notes)}</div>`
    : "";
  const extHtml  = extNote ? `<div class="cotd-ext">${extNote}</div>` : "";

  const overlay = document.getElementById('cotd-overlay');
  overlay.innerHTML = `
    <div class="cotd-card" role="dialog" aria-modal="true">
      <div class="cotd-header">
        <span class="cotd-header-icon">💡</span>
        <div class="cotd-header-text">
          <div class="cotd-header-label">Code of the Day</div>
          <div class="cotd-header-title">Worth remembering</div>
        </div>
      </div>
      <div class="cotd-body">
        <div class="cotd-code-row">
          <span class="cotd-code">${esc(c)}</span>
          <span class="cotd-fee">${feeStr}</span>
        </div>
        <div class="cotd-desc">${esc(desc)}</div>
        <span class="cotd-cat">${esc(cat)}</span>
        ${noteHtml}
        ${extHtml}
      </div>
      <div class="cotd-footer">
        <button class="cotd-btn-optout" onclick="closeCOTD(true)">Disable Code of the Day</button>
        <button class="cotd-btn-search" onclick="closeCOTD();document.getElementById('query').value='${esc(c)}';document.getElementById('query').dispatchEvent(new Event('input'));document.getElementById('query').focus()">Search this code</button>
        <button class="cotd-btn-dismiss" onclick="closeCOTD()">Got it</button>
      </div>
    </div>`;
  overlay.style.display = 'flex';
  document.body.style.overflow = 'hidden';
}

function closeCOTD(optOut) {
  if (optOut) localStorage.setItem('cotd_optout', '1');
  document.getElementById('cotd-overlay').style.display = 'none';
  document.body.style.overflow = '';
}

document.addEventListener('keydown', e => { if (e.key === 'Escape') closeCOTD(); });

// Show once per session, unless permanently opted out
if (!localStorage.getItem('cotd_optout') && !sessionStorage.getItem('cotd_shown')) {
  sessionStorage.setItem('cotd_shown', '1');
  openCOTD();
}

// ── Time-based billing reminders ─────────────────────────────────────────────
(function() {
  const now  = new Date();
  const day  = now.getDay();   // 0=Sun,1=Mon,...,5=Fri,6=Sat
  const hour = now.getHours(); // 0–23
  const isEvening = hour >= 17; // 5pm–midnight (midnight = next day, hour 0)

  // Ontario OHIP statutory holidays — treated as weekend/holiday billing
  const OHIP_HOLIDAYS = {
    // 2026
    "2026-01-01": "New Year's Day",
    "2026-02-16": "Family Day",
    "2026-04-03": "Good Friday",
    "2026-05-18": "Victoria Day",
    "2026-07-01": "Canada Day",
    "2026-08-03": "Civic Holiday",
    "2026-09-07": "Labour Day",
    "2026-10-12": "Thanksgiving",
    // 2026 Festive Season (Dec 25 – Jan 1)
    "2026-12-25": "Christmas Day",
    "2026-12-26": "Boxing Day",
    "2026-12-27": "Festive Season",
    "2026-12-28": "Festive Season",
    "2026-12-29": "Festive Season",
    "2026-12-30": "Festive Season",
    "2026-12-31": "New Year's Eve",
    // 2027
    "2027-01-01": "New Year's Day",
    "2027-02-15": "Family Day",
    "2027-03-26": "Good Friday",
    "2027-05-24": "Victoria Day",
    "2027-07-01": "Canada Day",
    "2027-08-02": "Civic Holiday",
    "2027-09-06": "Labour Day",
    "2027-10-11": "Thanksgiving",
    // 2027 Festive Season (Dec 25 – Jan 1)
    "2027-12-25": "Christmas Day",
    "2027-12-26": "Boxing Day",
    "2027-12-27": "Festive Season",
    "2027-12-28": "Festive Season",
    "2027-12-29": "Festive Season",
    "2027-12-30": "Festive Season",
    "2027-12-31": "New Year's Eve",
    "2028-01-01": "New Year's Day",
  };

  // Today's date as YYYY-MM-DD in local time
  const yyyy = now.getFullYear();
  const mm   = String(now.getMonth() + 1).padStart(2, '0');
  const dd   = String(now.getDate()).padStart(2, '0');
  const todayStr = `${yyyy}-${mm}-${dd}`;
  const holidayName = OHIP_HOLIDAYS[todayStr] || null;

  let reminder = null;

  if (holidayName) {
    // Statutory holiday — H15x assessments + H113 holiday premium + E412 after-hours premium apply all day
    reminder = {
      title: `🎉 Today is ${holidayName} — Holiday Billing Applies!`,
      body:  "Remember to bill holiday codes where applicable:",
      codes: [
        { code: "H15x", label: "H15x – Wkd/Hol assessments (H151–H154)", search: "H15" },
        { code: "H113", label: "H113 – Wkd/Hol + Fri eve premium", search: "H113" },
        { code: "E412", label: "E412 – After-hours procedural premium (+20%)", search: "E412" },
      ]
    };
  } else if (day === 0 || day === 6) {
    // Saturday or Sunday
    reminder = {
      title: "It’s the Weekend!",
      body:  "Remember to bill where applicable:",
      codes: [
        { code: "H15x", label: "H15x – Wkd/Hol assessments (H151–H154)", search: "H15" },
        { code: "H113", label: "H113 – Wkd/Hol + Fri eve premium", search: "H113" },
      ]
    };
  } else if (day === 5 && isEvening) {
    // Friday evening 5pm–midnight
    reminder = {
      title: "It’s Friday Evening!",
      body:  "Remember to bill where applicable:",
      codes: [
        { code: "H15x", label: "H15x – Wkd/Hol assessments (H151–H154)", search: "H15" },
        { code: "H113", label: "H113 – Wkd/Hol + Fri eve premium", search: "H113" },
      ]
    };
  } else if (day >= 1 && day <= 4 && isEvening) {
    // Monday–Thursday evening 5pm–midnight
    reminder = {
      title: "It’s a Weekday Evening (Mon–Thu)!",
      body:  "Remember to bill evening codes where applicable:",
      codes: [
        { code: "H114", label: "H114 – Weekday eve premium (NEW Apr 2026)" },
      ]
    };
  }

  if (!reminder) return;

  const codesHtml = reminder.codes.map(c =>
    `<code title="${c.label}" onclick="document.getElementById('query').value='${c.search||c.code}';document.getElementById('query').dispatchEvent(new Event('input'));document.getElementById('query').focus()">${c.code}</code>`
  ).join('');

  const banner = document.getElementById('reminder-banner');
  banner.className = 'reminder-banner';
  banner.innerHTML = `
    <span class="reminder-icon">🔔</span>
    <div class="reminder-body">
      <div class="reminder-title">${reminder.title}</div>
      <div class="reminder-codes">${reminder.body} ${codesHtml}</div>
    </div>
    <button class="reminder-dismiss" onclick="this.closest('#reminder-banner').style.display='none'" title="Dismiss">✕</button>
  `;
  banner.style.display = '';
})();
