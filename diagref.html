/* ── Render ── */
function toggle(btn) {
  const body = btn.nextElementSibling;
  const isOpen = body.classList.toggle('open');
  btn.classList.toggle('open', isOpen);
}

function renderAll() {
  const container = document.getElementById('diag-ref');

  CATEGORIES.forEach(cat => {
    const codes = DIAG_CODES.filter(d => d.category === cat.key);
    if (!codes.length) return;

    const rows = codes.map(d =>
      `<div class="code-row">
         <span class="row-code">${d.code}</span>
         <span class="row-desc">${d.description}</span>
       </div>`
    ).join('');

    const el = document.createElement('div');
    el.className = 'accordion';
    el.innerHTML = `
      <button class="accordion-header" onclick="toggle(this)">
        <span>
          <span class="accordion-title">${cat.icon} ${cat.label}</span>
        </span>
        <span class="accordion-chevron">▼</span>
      </button>
      <div class="accordion-body">${rows}</div>`;
    container.appendChild(el);
  });
}

renderAll();
