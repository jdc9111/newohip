<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Billing Code Search | ShiftCodes</title>
<meta name="description" content="Use AI to find the right OHIP billing code for any emergency department presentation or procedure.">
<meta property="og:site_name" content="ShiftCodes">
<meta property="og:type" content="website">
<meta property="og:title" content="AI Billing Code Search | ShiftCodes">
<meta property="og:description" content="Use AI to find the right OHIP billing code for any emergency department presentation or procedure.">
<meta property="og:url" content="https://newohipcodes.netlify.app/ai-billing.html">
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-YMK3RYM38R"></script>

  window.dataLayer = window.dataLayer || [];

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    background: #f0f4f8; color: #1a202c;
    min-height: 100vh; display: flex; flex-direction: column;
  }
  /* header/nav styles → header.js */

  .search-bar {
    background: white;
    padding: 14px 24px;
    border-bottom: 1px solid #dde3ed;
    position: sticky; top: 0; z-index: 10;
    box-shadow: 0 2px 12px rgba(0,0,0,0.06);
  }
  .search-wrap { max-width: 820px; margin: 0 auto; }
  .ai-input-row { position: relative; display: flex; gap: 8px; align-items: center; }
  .ai-input-row svg {
    position: absolute; left: 14px; top: 50%;
    transform: translateY(-50%); color: #b45309; pointer-events: none;
  }
  #ai-query {
    flex: 1;
    padding: 17px 14px 17px 44px;
    font-size: 1rem;
    border: 2px solid #fcd34d;
    border-radius: 8px;
    outline: none;
    transition: border-color 0.15s, box-shadow 0.15s;
    background: #fffbeb;
  }
  #ai-query:focus {
    border-color: #f59e0b;
    background: white;
    box-shadow: 0 0 0 3px rgba(245,158,11,0.2);
  }
  #ai-query::placeholder { color: #a16207; opacity: 0.7; }
  .ai-search-btn {
    padding: 0 20px;
    height: 56px;
    background: #1F4E79; color: white; border: none;
    border-radius: 8px; font-size: 0.88rem; font-weight: 600;
    cursor: pointer; white-space: nowrap;
    transition: background 0.15s;
    display: flex; align-items: center; gap: 6px; flex-shrink: 0;
  }
  .ai-search-btn:hover { background: #163d5e; }
  .ai-search-btn:disabled { background: #93c5fd; cursor: not-allowed; }
  .search-examples {
    max-width: 820px; margin: 8px auto 0;
    display: flex; flex-wrap: wrap; gap: 6px;
  }
  .search-chip {
    font-size: 0.75rem; color: #4a5568;
    background: #f0f4f8; border: 1px solid #cbd5e0;
    border-radius: 20px; padding: 4px 10px;
    cursor: pointer; transition: all 0.12s; font-family: inherit;
  }
  .search-chip:hover { background: #dde3ed; border-color: #a0aec0; color: #1a202c; }

  main { flex: 1; max-width: 860px; margin: 24px auto; padding: 0 16px 60px; width: 100%; }

  /* Results */
  .ai-results {
    background: #fffbeb; border: 1.5px solid #fcd34d;
    border-radius: 10px; overflow: hidden;
    box-shadow: 0 1px 4px rgba(0,0,0,0.06);
  }
  .ai-results-header {
    background: #fef3c7; border-bottom: 1px solid #fcd34d;
    padding: 10px 16px; font-size: 0.75rem; font-weight: 700;
    color: #92400e; text-transform: uppercase; letter-spacing: 0.06em;
  }
  .ai-results table {
    width: 100%; border-collapse: collapse;
    background: white;
  }
  .ai-results thead th {
    background: #1F4E79; color: white; font-size: 0.75rem;
    font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em;
    padding: 9px 14px; text-align: left;
  }
  .ai-results tbody tr { border-bottom: 1px solid #edf2f7; }
  .ai-results tbody tr:last-child { border-bottom: none; }
  .ai-results tbody tr:hover { background: #fef9e7; }
  .ai-results td { padding: 10px 14px; font-size: 0.88rem; vertical-align: middle; }
  .td-code { font-weight: 700; color: #1F4E79; white-space: nowrap; width: 90px; }
  .td-fee { font-size: 0.88rem; color: #166534; font-weight: 600; white-space: nowrap; }

  .ai-spinner {
    display: inline-block; width: 14px; height: 14px;
    border: 2px solid #fcd34d; border-top-color: #b45309;
    border-radius: 50%; animation: spin 0.7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .disclaimer {
    margin-top: 16px; padding: 10px 16px;
    background: white; border-radius: 8px; border-left: 3px solid #cbd5e0;
    font-size: 0.75rem; color: #718096;
  }

  .ai-cards { display: none; padding: 8px; gap: 8px; flex-direction: column; }

  @media (max-width: 640px) {
    .ai-results table { display: none !important; }
    .ai-cards { display: flex; }

    .result-card {
      background: white;
      border-radius: 10px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
      padding: 13px 16px;
      display: flex; flex-direction: column; gap: 3px;
    }
    .card-top {
      display: flex; justify-content: space-between; align-items: baseline;
      margin-bottom: 1px;
    }
    .card-code { font-size: 1.05rem; font-weight: 700; color: #1F4E79; letter-spacing: 0.03em; }
    .card-fee  { font-size: 1.05rem; font-weight: 700; color: #276749; }
    .card-desc { font-size: 0.9rem; color: #1a202c; line-height: 1.4; }
  }

  footer {
    position: fixed; bottom: 0; left: 0; right: 0;
    text-align: center; padding: 8px 24px; font-size: 0.78rem;
    color: #718096; background: white; border-top: 1px solid #dde3ed; z-index: 10;
  }
  footer a { color: #1F4E79; }
</style>
<script src="header.js?v=6"></script>
</head>
<body>

<app-header active="ai-billing"></app-header>

<div class="search-bar">
  <div class="search-wrap">
    <div class="ai-input-row">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
        <path d="M12 2a10 10 0 1 0 10 10"/><path d="m22 2-10 10"/><path d="M15 2h5v5"/>
      </svg>
      <input id="ai-query" type="text"
        placeholder="Describe a procedure or injury…"
        autocomplete="off" autofocus>
      <button class="ai-search-btn" id="ai-btn" onclick="aiSearch()">
        <span id="ai-btn-label">✨ Search</span>
      </button>
    </div>
    <div class="search-examples">
      <span class="search-chip" onclick="runExample('Shoulder dislocation reduction')">shoulder dislocation</span>
      <span class="search-chip" onclick="runExample('Pulled elbow')">pulled elbow</span>
      <span class="search-chip" onclick="runExample('I&D abscess')">abscess I&amp;D</span>
      <span class="search-chip" onclick="runExample('Foreign body removal')">foreign body</span>
      <span class="search-chip" onclick="runExample('Hip dislocation with sedation')">hip dislocation</span>
      <span class="search-chip" onclick="runExample('Complex laceration repair')">complex laceration</span>
    </div>
  </div>
</div>

<main>
  <div id="ai-results-container" style="display:none"></div>

  <div class="disclaimer">
    ⚠️ AI suggestions should always be verified against current OHIP billing guidelines before submission.
  </div>
</main>

<footer>
  Please send feedback/suggestions to <a href="mailto:chisholm.mirror@gmail.com">chisholm.mirror@gmail.com</a>
</footer>

<script>
function runExample(text) {
  document.getElementById('ai-query').value = text;
  aiSearch();
}

async function aiSearch() {
  const query = document.getElementById('ai-query').value.trim();
  if (!query) return;

  const btn       = document.getElementById('ai-btn');
  const label     = document.getElementById('ai-btn-label');
  const container = document.getElementById('ai-results-container');

  btn.disabled = true;
  label.innerHTML = '<span class="ai-spinner"></span> Searching...';
  container.style.display = 'none';

  try {
    const res = await fetch('/.netlify/functions/billing', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ query })
    });

    if (!res.ok) throw new Error('Function error ' + res.status);

    const data = await res.json();
    const results = data.results || [];

    if (!results.length) {
      container.innerHTML = '<div class="ai-results"><div class="ai-results-header">No suggestions found — try rephrasing</div></div>';
    } else {
      const rows = results.map(r =>
        `<tr>
          <td class="td-code">${r.code}</td>
          <td>${r.description}</td>
          <td class="td-fee">${r.fee || ''}</td>
        </tr>`
      ).join('');
      const cardItems = results.map(r =>
        `<div class="result-card">
          <div class="card-top">
            <span class="card-code">${r.code}</span>
            <span class="card-fee">${r.fee || '—'}</span>
          </div>
          <div class="card-desc">${r.description}</div>
        </div>`
      ).join('');
      container.innerHTML = `
        <div class="ai-results">
          <div class="ai-results-header">✨ AI Suggestions for &ldquo;${query}&rdquo;</div>
          <table>
            <thead><tr><th>Code</th><th>Description</th><th>Fee</th></tr></thead>
            <tbody>${rows}</tbody>
          </table>
          <div class="ai-cards">${cardItems}</div>
        </div>`;
    }
    container.style.display = '';

  } catch (err) {
    container.innerHTML = '<div class="ai-results"><div class="ai-results-header" style="color:#dc2626">AI search unavailable — please try again</div></div>';
    container.style.display = '';
    console.error(err);
  } finally {
    btn.disabled = false;
    label.innerHTML = '✨ AI Search';
  }
}

document.getElementById('ai-query').addEventListener('keydown', e => {
  if (e.key === 'Enter') aiSearch();
});
</script>
</body>
</html>
