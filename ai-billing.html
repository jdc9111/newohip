<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    background: #f0f4f8; color: #1a202c;
    min-height: 100vh; display: flex; flex-direction: column;
  }
  /* header/nav styles → header.js */

  .search-bar {
    background: white;
    padding: 14px 24px;
    border-bottom: 1px solid #dde3ed;
    position: sticky; top: 0; z-index: 10;
    box-shadow: 0 2px 12px rgba(0,0,0,0.06);
  }
  .search-wrap { max-width: 820px; margin: 0 auto; }
  .ai-input-row { display: flex; gap: 8px; align-items: center; }
  .ai-input-field { position: relative; flex: 1; }
  .ai-input-field svg {
    position: absolute; left: 14px; top: 50%;
    transform: translateY(-50%); color: #b45309; pointer-events: none;
  }
  #ai-query {
    width: 100%;
    padding: 17px 14px 17px 44px;
    font-size: 1rem;
    border: 2px solid #fcd34d;
    border-radius: 8px;
    outline: none;
    transition: border-color 0.15s, box-shadow 0.15s;
    background: #fffbeb;
  }
  #ai-query:focus {
    border-color: #f59e0b;
    background: white;
    box-shadow: 0 0 0 3px rgba(245,158,11,0.2);
  }
  #ai-query::placeholder { color: #a16207; opacity: 0.7; }
  .ai-search-btn {
    padding: 0 20px;
    height: 56px;
    background: #1F4E79; color: white; border: none;
    border-radius: 8px; font-size: 0.88rem; font-weight: 600;
    cursor: pointer; white-space: nowrap;
    transition: background 0.15s;
    display: flex; align-items: center; gap: 6px; flex-shrink: 0;
  }
  .ai-search-btn:hover { background: #163d5e; }
  .ai-search-btn:disabled { background: #93c5fd; cursor: not-allowed; }
  .search-examples {
    max-width: 820px; margin: 8px auto 0;
    display: flex; flex-wrap: wrap; gap: 6px;
  }
  .search-chip {
    font-size: 0.75rem; color: #4a5568;
    background: #f0f4f8; border: 1px solid #cbd5e0;
    border-radius: 20px; padding: 8px 12px;
    cursor: pointer; transition: all 0.12s; font-family: inherit;
  }
  .search-chip:hover { background: #dde3ed; border-color: #a0aec0; color: #1a202c; }
  .chip-toggle { display: none; font-weight: 700; }

  main { flex: 1; max-width: 860px; margin: 24px auto; padding: 0 16px 60px; width: 100%; }

  /* Results */
  .ai-results {
    background: #fffbeb; border: 1.5px solid #fcd34d;
    border-radius: 10px; overflow: hidden;
    box-shadow: 0 1px 4px rgba(0,0,0,0.06);
  }
  .ai-results-header {
    background: #fef3c7; border-bottom: 1px solid #fcd34d;
    padding: 10px 16px; font-size: 0.75rem; font-weight: 700;
    color: #92400e; text-transform: uppercase; letter-spacing: 0.06em;
  }
  .ai-results table {
    width: 100%; border-collapse: collapse;
    background: white;
  }
  .ai-results thead th {
    background: #1F4E79; color: white; font-size: 0.75rem;
    font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em;
    padding: 9px 14px; text-align: left;
  }
  .ai-results tbody tr { border-bottom: 1px solid #edf2f7; }
  .ai-results tbody tr:last-child { border-bottom: none; }
  .ai-results tbody tr:hover { background: #fef9e7; }
  .ai-results td { padding: 10px 14px; font-size: 0.88rem; vertical-align: middle; }
  .td-code { font-weight: 700; color: #1F4E79; white-space: nowrap; width: 90px; }
  .td-fee { font-size: 0.88rem; color: #166534; font-weight: 600; white-space: nowrap; }

  .ai-spinner {
    display: inline-block; width: 14px; height: 14px;
    border: 2px solid #fcd34d; border-top-color: #b45309;
    border-radius: 50%; animation: spin 0.7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .disclaimer {
    margin-top: 16px; padding: 10px 16px;
    background: white; border-radius: 8px; border-left: 3px solid #cbd5e0;
    font-size: 0.75rem; color: #718096;
  }

  .ai-cards { display: none; padding: 8px; gap: 8px; flex-direction: column; }

  @media (max-width: 640px) {
    .ai-input-row { flex-wrap: wrap; }
    .ai-input-field { flex-basis: 100%; }
    .ai-search-btn { flex: 1 1 100%; justify-content: center; }

    .chip-extra { display: none; }
    .chip-toggle { display: block; }
    .search-examples.expanded .chip-extra { display: block; }

    .ai-results table { display: none !important; }
    .ai-cards { display: flex; }

    .result-card {
      background: white;
      border-radius: 10px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
      padding: 13px 16px;
      display: flex; flex-direction: column; gap: 3px;
    }
    .card-top {
      display: flex; justify-content: space-between; align-items: baseline;
      margin-bottom: 1px;
    }
    .card-code { font-size: 1.05rem; font-weight: 700; color: #1F4E79; letter-spacing: 0.03em; }
    .card-fee  { font-size: 1.05rem; font-weight: 700; color: #276749; }
    .card-desc { font-size: 0.9rem; color: #1a202c; line-height: 1.4; }
  }

  footer {
    position: fixed; bottom: 0; left: 0; right: 0;
    text-align: center; padding: 8px 24px; font-size: 0.78rem;
    color: #718096; background: white; border-top: 1px solid #dde3ed; z-index: 10;
  }
  footer a { color: #1F4E79; }

<body>

<app-header active="ai-billing"></app-header>

<div class="search-bar">
  <div class="search-wrap">
    <div class="ai-input-row">
      <div class="ai-input-field">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <path d="M12 2a10 10 0 1 0 10 10"/><path d="m22 2-10 10"/><path d="M15 2h5v5"/>
        </svg>
        <input id="ai-query" type="text"
          placeholder="Describe a procedure or injury…"
          autocomplete="off">
        <script>if (matchMedia('(min-width: 641px)').matches) document.getElementById('ai-query').focus();</script>
      </div>
      <button class="ai-search-btn" id="ai-btn" onclick="aiSearch()">
        <span id="ai-btn-label">✨ Search</span>
      </button>
    </div>
    <div class="search-examples" id="searchExamples">
      <span class="search-chip" onclick="runExample('Shoulder dislocation reduction')">shoulder dislocation</span>
      <span class="search-chip" onclick="runExample('Pulled elbow')">pulled elbow</span>
      <span class="search-chip" onclick="runExample('I&D abscess')">abscess I&amp;D</span>
      <span class="search-chip chip-toggle" onclick="toggleChips(this)">Examples</span>
      <span class="search-chip chip-extra" onclick="runExample('Foreign body removal')">foreign body</span>
      <span class="search-chip chip-extra" onclick="runExample('Hip dislocation with sedation')">hip dislocation</span>
      <span class="search-chip chip-extra" onclick="runExample('Complex laceration repair')">complex laceration</span>
    </div>
  </div>
</div>

<main>
  <div id="ai-results-container" style="display:none"></div>

  <div class="disclaimer">
    ⚠️ AI suggestions should always be verified against current OHIP billing guidelines before submission.
  </div>
</main>


<script>
function runExample(text) {
  document.getElementById('ai-query').value = text;
  aiSearch();
}

function toggleChips(btn) {
  const expanded = document.getElementById('searchExamples').classList.toggle('expanded');
  btn.textContent = expanded ? 'Hide' : 'Examples';
}

async function aiSearch() {
  const query = document.getElementById('ai-query').value.trim();
  if (!query) return;

  const btn       = document.getElementById('ai-btn');
  const label     = document.getElementById('ai-btn-label');
  const container = document.getElementById('ai-results-container');

  btn.disabled = true;
  label.innerHTML = '<span class="ai-spinner"></span> Searching...';
  container.style.display = 'none';
  container.innerHTML = '';

  let tbody = null, cardsEl = null, resultCount = 0;

  function ensureShell() {
    if (tbody) return;
    container.innerHTML = `
      <div class="ai-results">
        <div class="ai-results-header">✨ AI Suggestions for &ldquo;${query}&rdquo;</div>
        <table>
          <thead><tr><th>Code</th><th>Description</th><th>Fee</th></tr></thead>
          <tbody id="ai-tbody"></tbody>
        </table>
        <div class="ai-cards" id="ai-cards"></div>
      </div>`;
    tbody   = document.getElementById('ai-tbody');
    cardsEl = document.getElementById('ai-cards');
    container.style.display = '';
  }

  function addResult(r) {
    if (!r || !r.code) return;
    ensureShell();
    resultCount++;
    const tr = document.createElement('tr');
    tr.innerHTML = `<td class="td-code">${r.code}</td><td>${r.description || ''}</td><td class="td-fee">${r.fee || ''}</td>`;
    tbody.appendChild(tr);
    const card = document.createElement('div');
    card.className = 'result-card';
    card.innerHTML = `
      <div class="card-top">
        <span class="card-code">${r.code}</span>
        <span class="card-fee">${r.fee || '—'}</span>
      </div>
      <div class="card-desc">${r.description || ''}</div>`;
    cardsEl.appendChild(card);
  }

  // Accepts a bare result object, a {"results":[...]} wrapper, or a raw
  // array -- the model doesn't always follow the "one object per line"
  // instruction exactly, so this unwraps whatever shape it produced.
  function addParsed(val) {
    if (Array.isArray(val)) { val.forEach(addParsed); return; }
    if (val && Array.isArray(val.results)) { val.results.forEach(addParsed); return; }
    addResult(val);
  }

  // Scans the accumulated model text for complete, balanced {...} objects
  // (string-literal aware) and parses each one as soon as its closing
  // brace arrives -- this renders results incrementally regardless of
  // whether the model wraps them in an array, separates them by newlines,
  // or wraps everything in a {"results":[...]} object.
  function extractObjects(buf) {
    let i = 0;
    while (true) {
      const start = buf.indexOf('{', i);
      if (start === -1) return buf.slice(i);
      let depth = 0, inStr = false, esc = false, closed = -1;
      for (let j = start; j < buf.length; j++) {
        const ch = buf[j];
        if (inStr) {
          if (esc) esc = false;
          else if (ch === '\\') esc = true;
          else if (ch === '"') inStr = false;
          continue;
        }
        if (ch === '"') { inStr = true; continue; }
        if (ch === '{') depth++;
        else if (ch === '}') { depth--; if (depth === 0) { closed = j; break; } }
      }
      if (closed === -1) return buf.slice(start); // incomplete object, wait for more data
      try { addParsed(JSON.parse(buf.slice(start, closed + 1))); } catch (e) { /* malformed, ignore */ }
      i = closed + 1;
    }
  }

  try {
    const res = await fetch('/.netlify/functions/billing', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ query })
    });

    if (!res.ok || !res.body) throw new Error('Function error ' + res.status);

    const reader  = res.body.getReader();
    const decoder = new TextDecoder();
    let sseBuf  = '';  // raw SSE frame buffer
    let textBuf = '';  // accumulated model text pending object extraction

    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      sseBuf += decoder.decode(value, { stream: true });

      let idx;
      while ((idx = sseBuf.indexOf('\n\n')) !== -1) {
        const frame = sseBuf.slice(0, idx);
        sseBuf = sseBuf.slice(idx + 2);
        for (const rawLine of frame.split('\n')) {
          const dataLine = rawLine.trim();
          if (!dataLine.startsWith('data:')) continue;
          const payload = dataLine.slice(5).trim();
          if (payload === '[DONE]') continue;
          try {
            const delta = JSON.parse(payload).choices?.[0]?.delta?.content;
            if (delta) {
              textBuf += delta;
              textBuf = extractObjects(textBuf);
            }
          } catch (e) { /* malformed SSE payload, ignore */ }
        }
      }
    }
    extractObjects(textBuf); // flush anything left in the buffer

    if (!resultCount) {
      container.innerHTML = '<div class="ai-results"><div class="ai-results-header">No suggestions found — try rephrasing</div></div>';
      container.style.display = '';
    }

  } catch (err) {
    container.innerHTML = '<div class="ai-results"><div class="ai-results-header" style="color:#dc2626">AI search unavailable — please try again</div></div>';
    container.style.display = '';
    console.error(err);
  } finally {
    btn.disabled = false;
    label.innerHTML = '✨ AI Search';
  }
}

document.getElementById('ai-query').addEventListener('keydown', e => {
  if (e.key === 'Enter') aiSearch();
});
</script>
</body>
</html>
