<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="description" content="Use AI to find the right diagnostic code for any emergency department presentation in Ontario.">

<meta property="og:type" content="website">
<meta property="og:title" content="AI Diagnostic Code Search | ShiftCodes">
<meta property="og:description" content="Use AI to find the right diagnostic code for any emergency department presentation in Ontario.">
<meta property="og:url" content="https://newohipcodes.netlify.app/ai-diag.html">

<script async src="https://www.googletagmanager.com/gtag/js?id=G-YMK3RYM38R"></script>

  window.dataLayer = window.dataLayer || [];

<link rel="stylesheet" href="steel.css?v=1">
<style>
  /* Shared foundation → steel.css. Header/nav → header-v2.js.
     Legacy split AI page; superseded by ai-search.html. */

  .search-wrap { max-width: 928px; margin: 0 auto; }
  .ai-input-row { display: flex; gap: 8px; align-items: stretch; }
  .ai-input-field { flex: 1; }

  /* ai-diag: hint + button row under the input; examples panel in main. */
  .search-actions {
    display: flex; align-items: center; justify-content: space-between;
    margin: 9px 0 0; gap: 12px; flex-wrap: wrap;
  }
  .ai-hint {
    font-family: var(--sc-mono); font-size: 0.63rem; letter-spacing: 0.13em;
    text-transform: uppercase; color: var(--sc-muted);
  }
  .examples {
    background: #fff; border: 1px solid var(--sc-line);
    border-radius: 12px; padding: 16px 18px; margin-bottom: 20px;
  }
  .examples-title {
    font-family: var(--sc-mono); font-size: 0.64rem; font-weight: 600;
    letter-spacing: 0.16em; text-transform: uppercase; color: var(--sc-muted);
    margin-bottom: 10px;
  }
  .example-chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .example-chip {
    font-family: var(--sc-sans); font-size: 0.76rem; font-weight: 500;
    color: var(--sc-rail-deep); background: var(--sc-surface);
    border: 1px solid var(--sc-line); border-radius: 999px;
    padding: 7px 13px; cursor: pointer;
    transition: background 0.12s, border-color 0.12s;
  }
  .example-chip:hover { background: #E4EEF7; border-color: #B9D2E6; }

  /* ── Results ── */
  .ai-results table { border: none; border-radius: 0; }
  .ai-results thead th:nth-child(1) { width: 90px; text-align: center; }
  .ai-results thead th:nth-child(3) { width: 85px; text-align: right; }
  .td-code {
    text-align: center; font-weight: 700; font-size: 0.92rem;
    color: var(--sc-rail-deep); letter-spacing: 0.03em; white-space: nowrap;
  }
  .td-fee { text-align: right; font-weight: 600; color: var(--sc-rail-deep); white-space: nowrap; }

  /* Doubles as the results caption and the empty / error message. */
  .ai-results-header {
    padding: 11px 16px;
    font-family: var(--sc-mono); font-size: 0.64rem; font-weight: 600;
    letter-spacing: 0.16em; text-transform: uppercase; color: var(--sc-muted);
    border-bottom: 1px solid var(--sc-line);
  }
  .ai-results-header:last-child { border-bottom: none; padding: 22px 16px; text-align: center; }

  .ai-spinner {
    display: inline-block; width: 13px; height: 13px;
    border: 2px solid rgba(255,255,255,0.35); border-top-color: #fff;
    border-radius: 50%; animation: spin 0.7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .disclaimer { margin-top: 16px; }
  .ai-cards { display: none; padding: 8px; gap: 8px; flex-direction: column; }

  @media (max-width: 640px) {
    .ai-input-row { flex-wrap: wrap; }
    .ai-input-field { flex-basis: 100%; }
    .ai-search-btn { flex: 1 1 100%; }
    .search-actions .ai-search-btn { flex: 1 1 auto; }
    .example-chips .chip-extra { display: none; }
    .example-chips .chip-toggle { display: block; }
    .example-chips.expanded .chip-extra { display: block; }

    .ai-results { background: none; border: none; border-radius: 0; overflow: visible; }
    .ai-results table { display: none !important; }
    .ai-results-header { background: #fff; border: 1px solid var(--sc-line); border-radius: 10px; margin-bottom: 8px; }
    .ai-cards { display: flex; padding: 0; }
  }
</style>
<script src="header-v2.js?v=25"></script>
</head>
<body>

<app-header active="ai-diag"></app-header>

<div class="search-bar">
  <div class="search-wrap">
    <div class="ai-input-row sc-input-wrap">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v5M12 16v5M3 12h5M16 12h5M6 6l3 3M15 15l3 3M18 6l-3 3M9 15l-3 3"></path></svg>
      <input id="ai-query" class="sc-input" type="text"
        placeholder="e.g. afib, PE, shingles, BPPV, OD, chest pain, blocked bowel..."
        autocomplete="off">
      <script>if (matchMedia('(min-width: 641px)').matches) document.getElementById('ai-query').focus();</script>
    </div>
    <div class="search-actions">
      <span class="ai-hint">AI &middot; understands abbreviations &amp; synonyms</span>
      <button class="ai-search-btn sc-btn" id="ai-btn" onclick="aiSearch()">
        <span id="ai-btn-label"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v5M12 16v5M3 12h5M16 12h5M6 6l3 3M15 15l3 3M18 6l-3 3M9 15l-3 3"></path></svg> Search</span>
      </button>
    </div>
  </div>
</div>

<main>
  <div id="examples-panel" class="examples">
    <div class="examples-title">Try an example</div>
    <div class="example-chips" id="exampleChips">
      <span class="example-chip" onclick="runExample(this)">afib</span>
      <span class="example-chip" onclick="runExample(this)">PE</span>
      <span class="example-chip" onclick="runExample(this)">shingles</span>
      <span class="example-chip chip-toggle" onclick="toggleChips(this)">Examples</span>
      <span class="example-chip chip-extra" onclick="runExample(this)">BPPV</span>
      <span class="example-chip chip-extra" onclick="runExample(this)">acute abdomen</span>
      <span class="example-chip chip-extra" onclick="runExample(this)">drug overdose</span>
    </div>
  </div>

  <div id="ai-results-container" style="display:none"></div>

  <div class="disclaimer sc-note">
    AI suggestions should always be verified against current OHIP billing guidelines before submission.
  </div>
</main>


<script>
function runExample(el) {
  document.getElementById('ai-query').value = el.textContent;
  aiSearch();
}

function toggleChips(btn) {
  const expanded = document.getElementById('exampleChips').classList.toggle('expanded');
  btn.textContent = expanded ? 'Hide' : 'Examples';
}

async function aiSearch() {
  const query = document.getElementById('ai-query').value.trim();
  if (!query) return;

  const btn       = document.getElementById('ai-btn');
  const label     = document.getElementById('ai-btn-label');
  const container = document.getElementById('ai-results-container');
  const examples  = document.getElementById('examples-panel');

  btn.disabled = true;
  label.innerHTML = '<span class="ai-spinner"></span> Searching...';
  container.style.display = 'none';

  try {
    const res = await fetch('/.netlify/functions/diagnose', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ query })
    });

    if (!res.ok) throw new Error('Function error ' + res.status);

    const data = await res.json();
    const results = data.results || [];

    examples.style.display = 'none';

    if (!results.length) {
      container.innerHTML = '<div class="ai-results sc-card"><div class="ai-results-header">No suggestions found &mdash; try rephrasing</div></div>';
    } else {
      const rows = results.map(r =>
        '<tr><td class="td-code">' + r.code + '</td><td>' + r.description + '</td></tr>'
      ).join('');
      container.innerHTML =
        '<div class="ai-results sc-card">' +
          '<div class="ai-results-header">AI suggestions for &ldquo;' + query + '&rdquo;</div>' +
          '<table>' +
            '<thead><tr><th>Code</th><th>Diagnosis</th></tr></thead>' +
            '<tbody>' + rows + '</tbody>' +
          '</table>' +
        '</div>';
    }
    container.style.display = '';

  } catch (err) {
    examples.style.display = 'none';
    container.innerHTML = '<div class="ai-results sc-card"><div class="ai-results-header" style="color:#dc2626">AI search unavailable &mdash; please try again</div></div>';
    container.style.display = '';
    console.error(err);
  } finally {
    btn.disabled = false;
    label.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v5M12 16v5M3 12h5M16 12h5M6 6l3 3M15 15l3 3M18 6l-3 3M9 15l-3 3"></path></svg> Search';
  }
}

document.getElementById('ai-query').addEventListener('keydown', e => {
  if (e.key === 'Enter') aiSearch();
});
</script>
</body>
</html>
