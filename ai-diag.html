<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Diagnostic Code Search | ShiftCodes</title>
<meta name="description" content="Use AI to find the right diagnostic code for any emergency department presentation in Ontario.">
<meta property="og:site_name" content="ShiftCodes">
<meta property="og:type" content="website">
<meta property="og:title" content="AI Diagnostic Code Search | ShiftCodes">
<meta property="og:description" content="Use AI to find the right diagnostic code for any emergency department presentation in Ontario.">
<meta property="og:url" content="https://newohipcodes.netlify.app/ai-diag.html">

<script async src="https://www.googletagmanager.com/gtag/js?id=G-YMK3RYM38R"></script>

  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}

  gtag('config', 'G-YMK3RYM38R');

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    background: #f0f4f8; color: #1a202c;
    min-height: 100vh; display: flex; flex-direction: column;
  }

  .search-bar {
    background: white;
    padding: 16px 24px;
    border-bottom: 1px solid #dde3ed;
    position: sticky; top: 0; z-index: 10;
    box-shadow: 0 2px 6px rgba(0,0,0,0.07);
  }
  .search-wrap { max-width: 720px; margin: 0 auto; }
  .ai-input-row { position: relative; }
  .ai-input-row svg {
    position: absolute; left: 14px; top: 50%;
    transform: translateY(-50%); color: #b45309; pointer-events: none;
  }
  #ai-query {
    width: 100%;
    padding: 13px 14px 13px 44px;
    font-size: 1rem;
    border: 2px solid #fcd34d;
    border-radius: 8px;
    outline: none;
    transition: border-color 0.15s;
    background: #fffbeb;
  }
  #ai-query:focus { border-color: #f59e0b; background: white; }
  #ai-query::placeholder { color: #a16207; opacity: 0.7; }
  .search-actions {
    display: flex; align-items: center; justify-content: space-between;
    max-width: 720px; margin: 8px auto 0; gap: 12px;
  }
  .ai-hint { font-size: 0.75rem; color: #92400e; }
  .ai-search-btn {
    padding: 10px 20px;
    background: #1F4E79; color: white; border: none;
    border-radius: 8px; font-size: 0.88rem; font-weight: 600;
    cursor: pointer; white-space: nowrap;
    transition: background 0.15s;
    display: flex; align-items: center; gap: 6px; flex-shrink: 0;
  }
  .ai-search-btn:hover { background: #163d5e; }
  .ai-search-btn:disabled { background: #93c5fd; cursor: not-allowed; }

  main { flex: 1; max-width: 860px; margin: 24px auto; padding: 0 16px 60px; width: 100%; }

  .examples {
    background: white; border-radius: 10px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    padding: 20px 24px; margin-bottom: 20px;
  }
  .examples-title {
    font-size: 0.72rem; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.07em; color: #718096; margin-bottom: 12px;
  }
  .example-chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .example-chip {
    background: #fffbeb; border: 1.5px solid #fcd34d;
    border-radius: 20px; padding: 6px 14px;
    font-size: 0.82rem; color: #92400e; cursor: pointer;
    transition: all 0.15s;
  }
  .example-chip:hover { background: #fef3c7; border-color: #f59e0b; }

  .ai-results {
    background: #fffbeb; border: 1.5px solid #fcd34d;
    border-radius: 10px; overflow: hidden;
    box-shadow: 0 1px 4px rgba(0,0,0,0.06);
  }
  .ai-results-header {
    background: #fef3c7; border-bottom: 1px solid #fcd34d;
    padding: 10px 16px; font-size: 0.75rem; font-weight: 700;
    color: #92400e; text-transform: uppercase; letter-spacing: 0.06em;
  }
  .ai-results table {
    width: 100%; border-collapse: collapse;
    background: white;
  }
  .ai-results thead th {
    background: #1F4E79; color: white; font-size: 0.75rem;
    font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em;
    padding: 9px 14px; text-align: left;
  }
  .ai-results thead th:first-child { width: 90px; }
  .ai-results tbody tr { border-bottom: 1px solid #edf2f7; }
  .ai-results tbody tr:last-child { border-bottom: none; }
  .ai-results tbody tr:hover { background: #fef9e7; }
  .ai-results td { padding: 10px 14px; font-size: 0.88rem; vertical-align: middle; }
  .td-code { font-weight: 700; color: #1F4E79; white-space: nowrap; text-align: center; }

  .ai-spinner {
    display: inline-block; width: 14px; height: 14px;
    border: 2px solid #fcd34d; border-top-color: #b45309;
    border-radius: 50%; animation: spin 0.7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .disclaimer {
    margin-top: 16px; padding: 10px 16px;
    background: white; border-radius: 8px; border-left: 3px solid #cbd5e0;
    font-size: 0.75rem; color: #718096;
  }

  footer {
    position: fixed; bottom: 0; left: 0; right: 0;
    text-align: center; padding: 8px 24px; font-size: 0.78rem;
    color: #718096; background: white; border-top: 1px solid #dde3ed; z-index: 10;
  }
  footer a { color: #1F4E79; }
</style>
<script src="header.js?v=3"></script>
</head>
<body>

<app-header active="ai-diag"></app-header>

<div class="search-bar">
  <div class="search-wrap">
    <div class="ai-input-row">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
        <path d="M12 2a10 10 0 1 0 10 10"/><path d="m22 2-10 10"/><path d="M15 2h5v5"/>
      </svg>
      <input id="ai-query" type="text"
        placeholder="e.g. afib, PE, shingles, BPPV, OD, chest pain, blocked bowel..."
        autocomplete="off" autofocus>
    </div>
    <div class="search-actions">
      <span class="ai-hint">&#10024; Understands abbreviations &amp; synonyms &mdash; powered by AI</span>
      <button class="ai-search-btn" id="ai-btn" onclick="aiSearch()">
        <span id="ai-btn-label">&#10024; AI Search</span>
      </button>
    </div>
  </div>
</div>

<main>
  <div id="examples-panel" class="examples">
    <div class="examples-title">Try an example</div>
    <div class="example-chips">
      <span class="example-chip" onclick="runExample(this)">afib</span>
      <span class="example-chip" onclick="runExample(this)">PE</span>
      <span class="example-chip" onclick="runExample(this)">shingles</span>
      <span class="example-chip" onclick="runExample(this)">BPPV</span>
      <span class="example-chip" onclick="runExample(this)">acute abdomen</span>
      <span class="example-chip" onclick="runExample(this)">drug overdose</span>
    </div>
  </div>

  <div id="ai-results-container" style="display:none"></div>

  <div class="disclaimer">
    &#9888;&#65039; AI suggestions should always be verified against current OHIP billing guidelines before submission.
  </div>
</main>

<footer>
  Please send feedback/suggestions to <a href="mailto:chisholm.mirror@gmail.com">chisholm.mirror@gmail.com</a>
</footer>

<script>
function runExample(el) {
  document.getElementById('ai-query').value = el.textContent;
  aiSearch();
}

async function aiSearch() {
  const query = document.getElementById('ai-query').value.trim();
  if (!query) return;

  const btn       = document.getElementById('ai-btn');
  const label     = document.getElementById('ai-btn-label');
  const container = document.getElementById('ai-results-container');
  const examples  = document.getElementById('examples-panel');

  btn.disabled = true;
  label.innerHTML = '<span class="ai-spinner"></span> Searching...';
  container.style.display = 'none';

  try {
    const res = await fetch('/.netlify/functions/diagnose', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ query })
    });

    if (!res.ok) throw new Error('Function error ' + res.status);

    const data = await res.json();
    const results = data.results || [];

    examples.style.display = 'none';

    if (!results.length) {
      container.innerHTML = '<div class="ai-results"><div class="ai-results-header">No suggestions found &mdash; try rephrasing</div></div>';
    } else {
      const rows = results.map(r =>
        '<tr><td class="td-code">' + r.code + '</td><td>' + r.description + '</td></tr>'
      ).join('');
      container.innerHTML =
        '<div class="ai-results">' +
          '<div class="ai-results-header">&#10024; AI Suggestions for &ldquo;' + query + '&rdquo;</div>' +
          '<table>' +
            '<thead><tr><th>Code</th><th>Diagnosis</th></tr></thead>' +
            '<tbody>' + rows + '</tbody>' +
          '</table>' +
        '</div>';
    }
    container.style.display = '';

  } catch (err) {
    examples.style.display = 'none';
    container.innerHTML = '<div class="ai-results"><div class="ai-results-header" style="color:#dc2626">AI search unavailable &mdash; please try again</div></div>';
    container.style.display = '';
    console.error(err);
  } finally {
    btn.disabled = false;
    label.innerHTML = '&#10024; AI Search';
  }
}

document.getElementById('ai-query').addEventListener('keydown', e => {
  if (e.key === 'Enter') aiSearch();
});
</script>
</body>
</html>
