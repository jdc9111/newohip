<link rel="stylesheet" href="steel.css?v=1">
<style>
  /* Shared foundation → steel.css. Header/nav → header-v2.js. */

  .search-wrap { max-width: 928px; margin: 0 auto; }
  #status {
    font-family: var(--sc-mono);
    font-size: 0.7rem;
    color: var(--sc-muted);
    margin-bottom: 10px;
    min-height: 1.2em;
  }
  thead th:nth-child(1) { width: 90px; text-align: center; }
  td { vertical-align: middle; }
  td:nth-child(1) { text-align: center; font-weight: 700; font-size: 0.92rem; color: var(--sc-rail-deep); letter-spacing: 0.03em; }
  #empty {
    display: none;
    text-align: center;
    padding: 44px 20px 48px;
    background: #fff;
    border: 1px solid var(--sc-line);
    border-radius: 12px;
    color: var(--sc-muted);
  }
  #empty p { font-size: 0.95rem; }
</style>
<script src="header-v2.js?v=25"></script>
<script src="diagData.js?v=2"></script>

<body>

<app-header active="diag"></app-header>

<div class="search-bar">
  <div class="search-wrap sc-input-wrap">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
      <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
    </svg>
    <input id="query" class="sc-input" type="search" placeholder="Search by code (e.g. 787) or diagnosis (e.g. fracture, chest pain, abscess)…" autocomplete="off">
    <script>if (matchMedia('(min-width: 641px)').matches) document.getElementById('query').focus();</script>
  </div>
  <p class="hint">Searches code and description simultaneously.</p>
</div>

<main>
<div id="status"></div>
  <table id="tbl" style="display:none">
    <thead><tr><th>Code</th><th>Diagnosis</th></tr></thead>
    <tbody id="tbody"></tbody>
  </table>
  <div id="empty"><p>No matching codes found.</p></div>
</main>


<script>
const TOKENS = DIAG.map(r => (r[0] + ' ' + r[1]).toLowerCase());

function score(h, needle) {
  const n = needle.toLowerCase();
  if (h.includes(n)) return 100 + (n.length / h.length) * 50;
  const words = n.split(/\s+/).filter(Boolean);
  let hits = 0;
  for (const w of words) { if (h.includes(w)) hits++; }
  if (hits === words.length) return 60 + hits * 5;
  if (hits > 0) return 30 + hits * 10;
  return 0;
}

function esc(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function highlight(text, q) {
  if (!q) return esc(text);
  const idx = text.toLowerCase().indexOf(q.toLowerCase());
  if (idx !== -1) {
    return esc(text.slice(0,idx)) + '<mark>' + esc(text.slice(idx,idx+q.length)) + '</mark>' + esc(text.slice(idx+q.length));
  }
  let result = esc(text);
  q.split(/\s+/).filter(Boolean).forEach(w => {
    const re = new RegExp(w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'), 'gi');
    result = result.replace(re, m => '<mark>' + m + '</mark>');
  });
  return result;
}

const tbody = document.getElementById('tbody');
const status = document.getElementById('status');
const empty  = document.getElementById('empty');
const tbl    = document.getElementById('tbl');

function render(query) {
  const q = (query || '').trim();
  tbody.innerHTML = '';
  if (!q) {
    tbl.style.display = 'none';
    empty.style.display = 'none';
    status.textContent = '';
    return;
  }
  const results = DIAG
    .map((r, i) => ({ r, s: score(TOKENS[i], q) }))
    .filter(x => x.s > 0)
    .sort((a, b) => b.s - a.s);
  if (results.length === 0) {
    tbl.style.display = 'none';
    empty.style.display = 'block';
    status.textContent = '';
    return;
  }
  tbl.style.display = '';
  empty.style.display = 'none';
  status.textContent = results.length + ' result' + (results.length === 1 ? '' : 's') + ' for "' + q + '"';
  const frag = document.createDocumentFragment();
  for (const { r } of results) {
    const tr = document.createElement('tr');
    tr.innerHTML = '<td>' + highlight(r[0], q) + '</td><td>' + highlight(r[1], q) + '</td>';
    frag.appendChild(tr);
  }
  tbody.appendChild(frag);
}

let timer;
document.getElementById('query').addEventListener('input', e => {
  clearTimeout(timer);
  timer = setTimeout(() => render(e.target.value), 120);
});


</script>
</body>
</html>
