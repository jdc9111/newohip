<script>
// Codes this calculator offers, in display order. The rows themselves come
// from billingData.js — the same array index.html and shift-value.html read —
// so a fee can no longer be right on one page and stale here.
const CALC_DATA_CODES = [
  "H101", "H102", "H103", "H104", "H131", "H132", "H133", "H134",
  "H121", "H122", "H123", "H124", "H151", "H152", "H153", "H154",

  "H981", "H985", "H989", "H987", "K005", "K028", "K034", "K015",
  "K623", "K070", "K035", "A771", "A777", "H105", "A320", "G521",
  "G523", "G522", "E420", "G395", "G391", "Z437", "G269", "G211",
  "Z341", "Z363", "Z611", "H100", "E009", "E019", "E007", "E018",
  "E011", "E024", "E022", "E017", "E016", "E020", "E010", "E400",
  "E401", "E413", "E412", "Z154", "Z177", "Z190", "Z192", "Z176",
  "Z175", "Z179", "Z191", "R024", "Z189", "Z187", "R606", "Z188",
  "P036", "R525", "R578", "J149C", "G269", "G224", "G268", "G060",
  "G061", "G260", "G231", "G370", "G328", "E446", "Z080", "Z331",
  "Z332", "Z590", "Z591", "G356", "Z520", "Z538", "Z543", "Z110",
  "Z608", "Z786", "Z128", "A920", "Z130", "S756", "G313", "Z804",
  "Z399", "L810", "G435", "Z432", "G552", "Z735", "Z756", "H264",
  "Z101", "Z226", "Z102", "Z506", "Z173", "Z714", "Z174", "Z715",
  "Z104", "Z140", "Z105", "Z740", "Z106", "Z227", "Z107", "Z510",
  "Z545", "E318", "Z114", "Z915", "Z115", "Z866", "R517", "Z311",
  "Z541", "Z312", "Z847", "Z848", "Z432A", "S547", "E023C", "G420",
  "G403", "Z315", "Z321", "Z316", "Z322", "Z314", "Z324", "F136",
  "D062", "F004", "F005", "E558", "F007", "F008", "F009", "F012",
  "F013", "F018", "F102", "F016", "F027", "F028", "F046", "F031",
  "F032", "F034", "F035", "F029", "F037", "F042", "F043", "F053",
  "F054", "F134", "F095", "F085", "F078", "F079", "F082", "F083",
  "F074", "F075", "F104", "F070", "F071", "F061", "F062", "F063",
  "F066", "F067", "F056", "F058", "E560", "E561", "D001", "E576",
  "D003", "D004", "D007", "D012", "D009", "D015", "D016", "D014",
  "D042", "D038", "D040", "D031", "D035", "D026", "D030", "D027",
  "Z201", "Z202", "Z203", "Z213", "Z211", "Z204"
];
const CALC_DATA = (() => {
  const byCode = new Map(DATA.map(r => [r[0], r]));
  const rows = CALC_DATA_CODES.map(c => byCode.get(c));
  const gone = CALC_DATA_CODES.filter(c => !byCode.has(c));
  if (gone.length) console.error("calc.html: codes missing from billingData.js: " + gone.join(", "));
  return rows.filter(Boolean);
})();

// ── extra search terms per category (not shown in the UI) ────────────────────
const CATEGORY_ALIASES = {
  "On-Call": "call-in call in callin callback call back"
};

// ── Search tokens ────────────────────────────────────────────────────────────
const TOKENS = CALC_DATA.map(r => (r[0] + " " + r[1] + " " + r[3] + " " + (CATEGORY_ALIASES[r[3]] || "")).toLowerCase());

function score(idx, needle) {
  const h = TOKENS[idx];
  const n = needle.toLowerCase().trim();
  if (!n) return 0;
  if (h.includes(n)) return 100 + (n.length / h.length) * 50;
  const words = n.split(/\s+/).filter(Boolean);
  let hits = 0;
  for (const w of words) if (h.includes(w)) hits++;
  if (hits === words.length) return 60 + hits * 5;
  if (hits > 0) return 30 + hits * 10;
  return 0;
}

// ── Bill state ───────────────────────────────────────────────────────────────
let bill = []; // [{id, code, desc, fee, cat, notes}]
let uid = 0;
let focusIdx = -1;

// ── Search / dropdown ────────────────────────────────────────────────────────
const qEl   = document.getElementById('query');
const drop  = document.getElementById('results-drop');

function renderDrop(results) {
  if (!results.length) { drop.classList.remove('open'); return; }
  drop.innerHTML = results.map((r, i) => {
    const feeStr = r[2] != null ? '$' + r[2].toFixed(2) : '—';
    const feeClass = r[2] != null ? 'drop-fee' : 'drop-fee null-fee';
    return `<div class="drop-item" data-idx="${i}" onmousedown="addItem(${CALC_DATA.indexOf(r)})">
      <span class="drop-code">${r[0]}</span>
      <span class="drop-desc">${r[1]}</span>
      <span class="${feeClass}">${feeStr}</span>
      <span class="drop-cat">${r[3]}</span>
    </div>`;
  }).join('');
  focusIdx = -1;
  drop.classList.add('open');
}

qEl.addEventListener('input', () => {
  const q = qEl.value.trim();
  if (!q) { drop.classList.remove('open'); return; }
  const scored = CALC_DATA
    .map((r, i) => ({ r, s: score(i, q) }))
    .filter(x => x.s > 0)
    .sort((a, b) => b.s - a.s)
    .slice(0, 12)
    .map(x => x.r);
  renderDrop(scored);
});

qEl.addEventListener('keydown', e => {
  const items = drop.querySelectorAll('.drop-item');
  if (!items.length) return;
  if (e.key === 'ArrowDown') {
    e.preventDefault();
    focusIdx = Math.min(focusIdx + 1, items.length - 1);
    updateFocus(items);
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    focusIdx = Math.max(focusIdx - 1, 0);
    updateFocus(items);
  } else if (e.key === 'Enter' && focusIdx >= 0) {
    e.preventDefault();
    items[focusIdx].dispatchEvent(new MouseEvent('mousedown'));
  } else if (e.key === 'Escape') {
    drop.classList.remove('open');
  }
});

function updateFocus(items) {
  items.forEach((el, i) => el.classList.toggle('focused', i === focusIdx));
  if (focusIdx >= 0) items[focusIdx].scrollIntoView({ block: 'nearest' });
}

document.addEventListener('click', e => {
  if (!e.target.closest('.search-wrap')) drop.classList.remove('open');
});

// ── Bill management ──────────────────────────────────────────────────────────
function addItem(dataIdx) {
  const r = CALC_DATA[dataIdx];
  bill.push({ id: uid++, code: r[0], desc: r[1], fee: r[2], cat: r[3], notes: r[4] });
  qEl.value = '';
  drop.classList.remove('open');
  qEl.focus();
  renderBill();
}

function removeItem(id) {
  bill = bill.filter(x => x.id !== id);
  renderBill();
}

function clearAll() {
  bill = [];
  renderBill();
}

const OMA_MULTIPLIER = 2.9;

function hasPremiumCode(code) {
  return bill.some(x => x.code === code);
}

function isPremiumTarget(code) {
  return /^[ZFD]/i.test(code);
}

function premiumMultiplier() {
  // Each premium adds on top of base; if somehow both present, stack additively
  let m = 1.0;
  if (hasPremiumCode('E412')) m += 0.2;
  if (hasPremiumCode('E413')) m += 0.4;
  return m;
}

function effectiveFee(item) {
  if (item.fee == null) return 0;
  if (isPremiumTarget(item.code) && premiumMultiplier() > 1.0) return item.fee * premiumMultiplier();
  return item.fee;
}

function renderBill() {
  const tbody  = document.getElementById('bill-body');
  const table  = document.getElementById('bill-table');
  const empty  = document.getElementById('empty-state');
  const clearB = document.getElementById('clear-btn');

  if (!bill.length) {
    table.classList.remove('visible');
    empty.style.display = '';
    clearB.classList.remove('visible');
    updateTotal();
    return;
  }

  empty.style.display = 'none';
  table.classList.add('visible');
  clearB.classList.add('visible');

  const mult      = premiumMultiplier();
  const premActive = mult > 1.0;
  const pctLabel  = '+' + Math.round((mult - 1) * 100) + '%';

  tbody.innerHTML = bill.map(item => {
    const isPremRow = item.code === 'E412' || item.code === 'E413';
    const applyPrem = premActive && isPremiumTarget(item.code) && item.fee != null;
    const dispFee   = applyPrem ? item.fee * mult : item.fee;
    const feeStr    = dispFee != null
      ? '$' + dispFee.toFixed(2) + (applyPrem ? `<span class="premium-badge">${pctLabel}</span>` : '')
      : '—';
    const feeCls    = item.fee == null ? 'col-fee null-fee'
                    : applyPrem        ? 'col-fee premium'
                    :                    'col-fee';
    const noteHtml  = item.notes ? `<small>${item.notes}</small>` : '';
    const rowCls    = isPremRow ? ' class="e412-row"' : '';
    return `<tr${rowCls}>
      <td class="col-code">${item.code}</td>
      <td class="col-desc">${item.desc}${noteHtml}</td>
      <td class="${feeCls}">${feeStr}</td>
      <td class="col-del"><button class="del-btn" onclick="removeItem(${item.id})" title="Remove">×</button></td>
    </tr>`;
  }).join('');

  updateTotal();
}

function updateTotal() {
  const count = bill.length;
  const total = bill.reduce((s, x) => s + effectiveFee(x), 0);
  const nulls = bill.filter(x => x.fee == null).length;
  const final = total * OMA_MULTIPLIER;
  const mult = premiumMultiplier();

  document.getElementById('total-count').textContent  = count;
  document.getElementById('total-amount').textContent = '$' + total.toFixed(2);
  document.getElementById('total-final').textContent  = '$' + final.toFixed(2);
  const noteparts = [];
  if (hasPremiumCode('E412') && hasPremiumCode('E413')) noteparts.push('+60% premium applied to Z/F/D codes (E412+E413)');
  else if (hasPremiumCode('E413')) noteparts.push('E413 +40% applied to Z/F/D codes');
  else if (hasPremiumCode('E412')) noteparts.push('E412 +20% applied to Z/F/D codes');
  if (nulls) noteparts.push(`${nulls} unit-based code${nulls > 1 ? 's' : ''} excluded`);
  document.getElementById('total-note').textContent = noteparts.join(' · ');
  document.getElementById('invoice-btn').disabled = bill.length === 0;
}

// ── Invoice modal ─────────────────────────────────────────────────────────────
function openInvoiceModal() {
  document.getElementById('inv-date').value = new Date().toISOString().slice(0,10);
  document.getElementById('invoice-modal').style.display = 'flex';
  document.getElementById('inv-patient').focus();
}
function closeInvoiceModal() {
  document.getElementById('invoice-modal').style.display = 'none';
}
