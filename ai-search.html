<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ShiftCodes">
<meta name="theme-color" content="#1F4E79">
<title>AI Code Search | ShiftCodes</title>
<meta name="description" content="Use AI to find the right OHIP billing code and diagnostic code for any emergency department presentation or procedure, in one search.">
<meta property="og:site_name" content="ShiftCodes">
<meta property="og:type" content="website">
<meta property="og:title" content="AI Code Search | ShiftCodes">
<meta property="og:description" content="Use AI to find the right OHIP billing code and diagnostic code for any emergency department presentation or procedure, in one search.">
<meta property="og:url" content="https://newohipcodes.netlify.app/ai-search.html">
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-YMK3RYM38R"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-YMK3RYM38R');
</script>
<link rel="stylesheet" href="steel.css?v=1">
<style>
  /* Shared foundation → steel.css. Header/nav → header-v2.js.
     Only AI-search-specific rules live here. */

  .search-wrap { max-width: 928px; margin: 0 auto; }
  .ai-input-row { display: flex; gap: 8px; align-items: stretch; }
  .ai-input-field { flex: 1; }

  /* ── Results ── */
  .results-section { margin-bottom: 28px; }
  .results-section:last-child { margin-bottom: 0; }

  .ai-results table { border: none; border-radius: 0; }
  .ai-results thead th:nth-child(1) { width: 90px; text-align: center; }
  .ai-results thead th:nth-child(3) { width: 85px; text-align: right; }
  .td-code {
    text-align: center; font-weight: 700; font-size: 0.92rem;
    color: var(--sc-rail-deep); letter-spacing: 0.03em; white-space: nowrap;
  }
  .td-fee { text-align: right; font-weight: 600; color: var(--sc-rail-deep); white-space: nowrap; }

  /* Quiet empty / error message inside the results card. */
  .ai-results-header {
    padding: 26px 20px 28px;
    text-align: center;
    font-size: 0.88rem; font-weight: 500; color: var(--sc-muted);
  }
  .section-error { padding: 14px 16px; font-size: 0.84rem; color: #B42318; }

  .ai-spinner {
    display: inline-block; width: 13px; height: 13px;
    border: 2px solid rgba(255,255,255,0.35); border-top-color: #fff;
    border-radius: 50%; animation: spin 0.7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .disclaimer { margin-top: 16px; }

  .ai-cards { display: none; padding: 8px; gap: 8px; flex-direction: column; }

  @media (max-width: 640px) {
    .ai-input-row { flex-wrap: wrap; }
    .ai-input-field { flex-basis: 100%; }
    .ai-search-btn { flex: 1 1 100%; }

    .ai-results { background: none; border: none; border-radius: 0; overflow: visible; }
    .ai-results table { display: none !important; }
    .ai-results-header, .section-error {
      background: #fff; border: 1px solid var(--sc-line); border-radius: 10px;
    }
    .ai-cards { display: flex; padding: 0; }
  }
</style>
<script src="header-v2.js?v=23"></script>
</head>
<body>

<app-header active="ai-search"></app-header>

<div class="search-bar">
  <div class="search-wrap">
    <div class="ai-input-row">
      <div class="ai-input-field sc-input-wrap">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v5M12 16v5M3 12h5M16 12h5M6 6l3 3M15 15l3 3M18 6l-3 3M9 15l-3 3"></path></svg>
        <input id="ai-query" class="sc-input" type="text"
          placeholder="Describe a procedure, injury, or diagnosis…"
          autocomplete="off">
        <script>if (matchMedia('(min-width: 641px)').matches) document.getElementById('ai-query').focus();</script>
      </div>
      <button class="ai-search-btn sc-btn" id="ai-btn" onclick="aiSearch()">
        <span id="ai-btn-label"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v5M12 16v5M3 12h5M16 12h5M6 6l3 3M15 15l3 3M18 6l-3 3M9 15l-3 3"></path></svg> Search</span>
      </button>
    </div>
    <p class="hint">AI &middot; billing + diagnostic codes</p>
    <div class="search-examples" id="searchExamples">
      <span class="search-chip" onclick="runExample('Shoulder dislocation reduction')">shoulder dislocation</span>
      <span class="search-chip" onclick="runExample('Afib')">afib</span>
      <span class="search-chip" onclick="runExample('I&D abscess')">abscess I&amp;D</span>
      <span class="search-chip chip-toggle" onclick="toggleChips(this)">Examples</span>
      <span class="search-chip chip-extra" onclick="runExample('Pulled elbow')">pulled elbow</span>
      <span class="search-chip chip-extra" onclick="runExample('PE')">PE</span>
      <span class="search-chip chip-extra" onclick="runExample('Complex laceration repair')">complex laceration</span>
    </div>
  </div>
</div>

<main>
  <div id="ai-results-container" style="display:none"></div>

  <div class="disclaimer sc-note">
    AI suggestions should always be verified against current OHIP billing guidelines before submission.
  </div>
</main>


<script>
const ICON_COIN = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M14.5 9h-3.2a1.8 1.8 0 0 0 0 3.6h1.4a1.8 1.8 0 0 1 0 3.6H9.5M12 7.2v1.8M12 15v1.8"></path></svg>';
const ICON_TAG  = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 12.5l9-9H20v7.5l-9 9z"></path><circle cx="16.2" cy="7.8" r="1.3"></circle></svg>';
const ICON_SPARK = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v5M12 16v5M3 12h5M16 12h5M6 6l3 3M15 15l3 3M18 6l-3 3M9 15l-3 3"></path></svg>';

function runExample(text) {
  document.getElementById('ai-query').value = text;
  aiSearch();
}

function toggleChips(btn) {
  const expanded = document.getElementById('searchExamples').classList.toggle('expanded');
  btn.textContent = expanded ? 'Hide' : 'Examples';
}

function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}

function renderBillingSection(results, error) {
  if (error && !results.length) {
    return `<div class="results-section">
      <div class="results-section-title">${ICON_COIN} Billing codes</div>
      <div class="ai-results sc-card"><div class="section-error">Billing lookup unavailable — ${escapeHtml(error)}</div></div>
    </div>`;
  }
  if (!results.length) {
    return `<div class="results-section">
      <div class="results-section-title">${ICON_COIN} Billing codes</div>
      <div class="ai-results sc-card"><div class="ai-results-header">No billing codes match that search</div></div>
    </div>`;
  }
  const rows = results.map(r =>
    `<tr>
      <td class="td-code">${escapeHtml(r.code)}</td>
      <td>${escapeHtml(r.description)}</td>
      <td class="td-fee">${escapeHtml(r.fee || '')}</td>
    </tr>`
  ).join('');
  const cardItems = results.map(r =>
    `<div class="result-card">
      <div class="card-top">
        <span class="card-code">${escapeHtml(r.code)}</span>
        <span class="card-fee">${escapeHtml(r.fee || '—')}</span>
      </div>
      <div class="card-desc">${escapeHtml(r.description)}</div>
    </div>`
  ).join('');
  return `<div class="results-section">
    <div class="results-section-title">${ICON_COIN} Billing codes</div>
    <div class="ai-results sc-card">
      <table>
        <thead><tr><th>Code</th><th>Description</th><th>Fee</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
      <div class="ai-cards">${cardItems}</div>
    </div>
  </div>`;
}

function renderDiagnosticSection(results, error) {
  if (error && !results.length) {
    return `<div class="results-section">
      <div class="results-section-title">${ICON_TAG} Diagnostic codes</div>
      <div class="ai-results sc-card"><div class="section-error">Diagnostic lookup unavailable — ${escapeHtml(error)}</div></div>
    </div>`;
  }
  if (!results.length) {
    return `<div class="results-section">
      <div class="results-section-title">${ICON_TAG} Diagnostic codes</div>
      <div class="ai-results sc-card"><div class="ai-results-header">No diagnostic codes match that search</div></div>
    </div>`;
  }
  const rows = results.map(r =>
    `<tr><td class="td-code">${escapeHtml(r.code)}</td><td>${escapeHtml(r.description)}</td></tr>`
  ).join('');
  const cardItems = results.map(r =>
    `<div class="result-card">
      <div class="card-top"><span class="card-code">${escapeHtml(r.code)}</span></div>
      <div class="card-desc">${escapeHtml(r.description)}</div>
    </div>`
  ).join('');
  return `<div class="results-section">
    <div class="results-section-title">${ICON_TAG} Diagnostic codes</div>
    <div class="ai-results sc-card">
      <table>
        <thead><tr><th>Code</th><th>Diagnosis</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
      <div class="ai-cards">${cardItems}</div>
    </div>
  </div>`;
}

async function aiSearch() {
  const query = document.getElementById('ai-query').value.trim();
  if (!query) return;

  const btn       = document.getElementById('ai-btn');
  const label     = document.getElementById('ai-btn-label');
  const container = document.getElementById('ai-results-container');

  btn.disabled = true;
  label.innerHTML = '<span class="ai-spinner"></span> Searching...';
  container.style.display = 'none';

  try {
    const res = await fetch('/.netlify/functions/search', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ query })
    });

    if (!res.ok) throw new Error('Function error ' + res.status);

    const data = await res.json();
    const billingResults    = data.billing || [];
    const diagnosticResults = data.diagnostic || [];
    const errors = data.errors || {};

    container.innerHTML =
      renderBillingSection(billingResults, errors.billing) +
      renderDiagnosticSection(diagnosticResults, errors.diagnostic);
    container.style.display = '';

  } catch (err) {
    container.innerHTML = '<div class="ai-results sc-card"><div class="ai-results-header" style="color:#dc2626">AI search unavailable — please try again</div></div>';
    container.style.display = '';
    console.error(err);
  } finally {
    btn.disabled = false;
    label.innerHTML = ICON_SPARK + ' Search';
  }
}

document.getElementById('ai-query').addEventListener('keydown', e => {
  if (e.key === 'Enter') aiSearch();
});
</script>
</body>
</html>
