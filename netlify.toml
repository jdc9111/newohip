[build]
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "18"

[functions]
  node_bundler = "esbuild"

# ai-billing.html and ai-diag.html were merged into a single AI Search page
# that returns both billing and diagnostic code suggestions. force = true so
# the redirect wins over the still-present (now unlinked) static files.
[[redirects]]
  from = "/ai-billing.html"
  to = "/ai-search.html"
  status = 301
  force = true

[[redirects]]
  from = "/ai-diag.html"
  to = "/ai-search.html"
  status = 301
  force = true

# diag.html's Basic Search was merged into index.html, which now shows both
# billing and diagnostic results for one query. force = true so the redirect
# wins over the still-present (now unlinked) static file.
[[redirects]]
  from = "/diag.html"
  to = "/"
  status = 301
  force = true

# Canonical paths for analytics. Nav links used to point at index.html
# explicitly, so GA4 split the home page between "/" and "/index.html"
# (and "/updates" vs "/updates.html" via Netlify pretty-URL rewriting).
# Links now use "/"; these 301s fold old bookmarks and home-screen
# shortcuts into the same path. Query strings (?fav=…) are preserved.
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/updates"
  to = "/updates.html"
  status = 301
